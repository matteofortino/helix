theme = "catppuccin_mocha"

[editor]
line-number = "relative"
mouse = false
auto-format = true
bufferline = "always"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[keys.insert.j]
k = "normal_mode"

[keys.normal]
G = "goto_file_end"
C-n = "file_explorer"
